<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="../css/site.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>计算机博士科研指数</title>
<style>
  :root {
    --bg: #f3f1eb;
    --paper: #fffcf7;
    --ink: #1c1915;
    --muted: #6f675e;
    --line: #e3dcd0;
    --accent: #8d3b2c;
    --accent-soft: #f3e4df;
    --open: #1f6b45;
    --shadow: 0 1px 0 rgba(28, 25, 21, 0.04);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 1440px;
    margin: 0 auto;
    padding: 20px 24px 16px;
    height: 100%;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .eyebrow {
    margin: 0 0 8px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .switch { display: flex; gap: 8px; margin: 0; flex: none; }
  .switch a {
    text-decoration: none;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
    background: var(--paper);
  }
  .switch a.current { color: #fff; background: var(--ink); border-color: var(--ink); }
  .head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px 16px;
    margin: 0 0 8px;
  }
  h1 {
    margin: 0;
    font-family: Palatino, "Palatino Linotype", "Songti SC", serif;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.15;
    min-width: 0;
  }
  .head-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
    flex: none;
  }
  .lead { max-width: 92ch; margin: 0 0 12px; color: #3a342c; }
  .weights {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 12px;
    padding: 0;
    list-style: none;
  }
  .weights li {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 13px;
    color: #3f382f;
  }
  .weights b { font-variant-numeric: tabular-nums; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
  }
  input[type="search"], select {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
  }
  input[type="search"] { min-width: min(320px, 100%); }
  .segs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .segs button {
    background: var(--paper);
    color: var(--ink);
    border: 0;
    border-right: 1px solid var(--line);
    padding: 8px 12px;
    font: inherit;
    cursor: pointer;
  }
  .segs button:last-child { border-right: 0; }
  .segs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  #best-effort {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    font: inherit;
    cursor: pointer;
  }
  #best-effort[aria-pressed="true"] { background: var(--ink); color: #fff; }
  #count { color: var(--muted); font-size: 13px; white-space: nowrap; }
  #best-effort { white-space: nowrap; }
  .table-wrap {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: auto;
    flex: 1;
    min-height: 0;
    box-shadow: var(--shadow);
  }
  table { border-collapse: collapse; min-width: 1280px; width: 100%; }
  th, td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    vertical-align: middle;
  }
  th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #faf7f2;
    text-align: right;
    font-size: 12px;
    font-weight: 600;
    color: #4d463e;
    cursor: pointer;
    user-select: none;
  }
  th.left, td.left { text-align: left; }
  th.sticky, td.sticky { position: sticky; z-index: 1; background: var(--paper); }
  th.sticky { z-index: 3; background: #faf7f2; }
  th.rank, td.rank { left: 0; min-width: 52px; text-align: right; }
  th.model, td.model { left: 52px; min-width: 280px; box-shadow: 8px 0 8px -8px rgba(28,25,21,0.12); }
  tbody tr:hover td { background: #fbf6f0; }
  tbody tr:hover td.sticky { background: #fbf6f0; }
  .who { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #f7f4ee;
    object-fit: contain;
    padding: 2px;
    flex: none;
  }
  .logo-fallback {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    flex: none;
  }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; font-weight: 400; }
  .tag {
    display: inline-block;
    margin-left: 6px;
    padding: 0 6px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    vertical-align: 1px;
  }
  .tag.open { color: var(--open); background: #e5f4eb; }
  .tag.old { color: #6a5420; background: #f6efd8; }
  .score { font-weight: 700; color: var(--accent); }
  .bar { height: 3px; margin-top: 4px; background: #efe8df; border-radius: 99px; width: 72px; margin-left: auto; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  td.num { text-align: right; }
  .delta-pos { color: var(--open); }
  .delta-neg { color: var(--accent); }
  .foot { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  .foot a { color: var(--accent); }
  tr.deprecated .name { color: var(--muted); }
</style>
</head>

}
function render() {
  const list = sorted(filtered());
  const prefix = bestOnly ? "最高 effort · " : "";
  countEl.textContent = prefix + list.length + " / " + DATA.length;
  rowsEl.innerHTML = list.map(row => {
    const tags = [
      row.open_weights ? '<span class="tag open">开源</span>' : "",
      row.deprecated ? '<span class="tag old">已弃用</span>' : ""
    ].join("");
    const delta = row.rank_delta_vs_aa;
    const deltaClass = delta > 0 ? "delta-pos" : delta < 0 ? "delta-neg" : "";
    const deltaText = delta > 0 ? "+" + delta : String(delta);
    const bar = Math.max(0, Math.min(100, row[SCORE_KEY]));
    const componentCells = COMPONENT_KEYS.map(key => `<td class="num">${num(comp(row, key))}</td>`).join("");
    return `<tr class="${row.deprecated ? "deprecated" : ""}">
      <td class="sticky rank">${row[RANK_KEY]}</td>
      <td class="sticky model left"><div class="who">${logoHtml(row)}<div><div class="name">${escapeHtml(row.model)}${tags}</div><div class="meta">${escapeHtml(row.creator || "")}</div></div></div></td>
      <td class="num"><div class="score">${num(row[SCORE_KEY])}</div><div class="bar"><span style="width:${bar}%"></span></div></td>
      <td class="num">${num(row.aa_intelligence_index_v4_3)}</td>
      <td class="num ${deltaClass}">${deltaText}</td>
      ${componentCells}
      <td class="left">${row.release_date || "—"}</td>
      <td class="num">${money(row.price_input_per_1m)}</td>
      <td class="num">${money(row.price_output_per_1m)}</td>
    </tr>`;
  }).join("");
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}
document.querySelectorAll("th[data-key]").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) sortDir *= -1;
    else {
      sortKey = key;
      sortDir = key === "model" || key === "release_date" ? 1 : -1;
    }
    render();
  });
});
document.getElementById("best-effort").addEventListener("click", (event) => {
  bestOnly = !bestOnly;
  event.currentTarget.setAttribute("aria-pressed", bestOnly ? "true" : "false");
  render();
});
render();
</script>
</body>
</html>
